<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="app-container">
      <h1>🌤️ Weather App</h1>
      <div class="controls">
        <select id="city-select">
          <option value="">Select a city</option>
          <option value="new york">New York</option>
          <option value="los angeles">Los Angeles</option>
          <option value="chicago">Chicago</option>
          <option value="paris">Paris</option>
          <option value="tokyo">Tokyo</option>
          <option value="london">London</option>
        </select>
        <button id="get-weather-btn">Get Weather</button>
      </div>

      <div id="weather-container">
        <div class="weather-header">
          <img id="weather-icon" src="" alt="Weather icon" />
          <div class="weather-main-info">
            <span id="location"></span>
            <span id="weather-main"></span>
          </div>
        </div>
        <div class="weather-details">
          <div class="detail-item">
            <span class="detail-label">Temperature</span>
            <span class="detail-value" id="main-temperature"></span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Feels Like</span>
            <span class="detail-value" id="feels-like"></span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Humidity</span>
            <span class="detail-value" id="humidity"></span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Wind Speed</span>
            <span class="detail-value" id="wind"></span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Wind Gust</span>
            <span class="detail-value" id="wind-gust"></span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
